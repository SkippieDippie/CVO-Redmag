name: CVO Redmag Release

on:
  release:
    types: [prereleased, released]

permissions:
  contents: write

jobs:
  release-dev:
    name: Build and publish Dev Workshop variant
    if: github.event.action == 'prereleased' || github.event.action == 'released'
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/release.yml@c26a9974afc83703d5c99a2c1b6c15017114f4d2
    with:
      release-tag: ${{ github.event.release.tag_name }}
      hemtt-version: v1.21.0
      version-header-path: addons/main/script_version.hpp
      meta-file-path: meta.cpp
      workshop-id: '3821765111'
      workshop-name: 'CVO Ammo Logistics (Dev)'
      release-folder: '@CVO-Redmag-Dev'
      publish-github: true
      publish-steam: true
      prerelease: ${{ github.event.action == 'prereleased' }}
      finalize-github: ${{ github.event.action == 'prereleased' }}
    secrets:
      steam_username: ${{ secrets.STEAM_USERNAME }}
      steam_password: ${{ secrets.STEAM_PASSWORD }}

  release-stable:
    name: Build and publish Stable Workshop variant
    needs: release-dev
    if: github.event.action == 'released'
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/release.yml@c26a9974afc83703d5c99a2c1b6c15017114f4d2
    with:
      release-tag: ${{ github.event.release.tag_name }}
      hemtt-version: v1.21.0
      version-header-path: addons/main/script_version.hpp
      meta-file-path: meta.cpp
      workshop-id: '3821740168'
      workshop-name: 'CVO Ammo Logistics'
      release-folder: '@CVO-Redmag'
      publish-github: true
      publish-steam: true
      prerelease: false
      finalize-github: true
    secrets:
      steam_username: ${{ secrets.STEAM_USERNAME }}
      steam_password: ${{ secrets.STEAM_PASSWORD }}
