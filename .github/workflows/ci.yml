name: CVO Redmag CI

on:
  push:
    branches:
      - rewrite
  pull_request:
    branches:
      - rewrite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hemtt-check:
    name: HEMTT checks
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@585c0cd2c8811741e44e4b6e9a662f16a1f10518
    with:
      operation: Check
      framework-ref: 585c0cd2c8811741e44e4b6e9a662f16a1f10518
      hemtt-version: v1.21.0

  hemtt-build:
    name: HEMTT build
    needs: hemtt-check
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@585c0cd2c8811741e44e4b6e9a662f16a1f10518
    with:
      operation: Build
      framework-ref: 585c0cd2c8811741e44e4b6e9a662f16a1f10518
      hemtt-version: v1.21.0
