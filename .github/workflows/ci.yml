name: CVO Redmag CI

on:
  push:
    branches:
      - rewrite
  pull_request:
    branches:
      - rewrite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hemtt-check:
    name: HEMTT checks
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@82d8726dff00e9a66b76b0d3d43eb909aad45196
    with:
      operation: Check
      framework-ref: 82d8726dff00e9a66b76b0d3d43eb909aad45196
      hemtt-version: v1.21.0

  hemtt-build:
    name: HEMTT build
    needs: hemtt-check
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@82d8726dff00e9a66b76b0d3d43eb909aad45196
    with:
      operation: Build
      framework-ref: 82d8726dff00e9a66b76b0d3d43eb909aad45196
      hemtt-version: v1.21.0
