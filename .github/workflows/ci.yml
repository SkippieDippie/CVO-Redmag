name: CVO Redmag CI

on:
  push:
    branches:
      - rewrite
  pull_request:
    branches:
      - rewrite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hemtt-check:
    name: HEMTT checks
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@7bcbc7cbef2ccc031ab4370afe40acbb2ed50840
    with:
      operation: Check
      framework-ref: 7bcbc7cbef2ccc031ab4370afe40acbb2ed50840
      hemtt-version: v1.21.0

  hemtt-build:
    name: HEMTT build
    needs: hemtt-check
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@7bcbc7cbef2ccc031ab4370afe40acbb2ed50840
    with:
      operation: Build
      framework-ref: 7bcbc7cbef2ccc031ab4370afe40acbb2ed50840
      hemtt-version: v1.21.0
