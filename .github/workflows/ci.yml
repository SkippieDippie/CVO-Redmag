name: CVO Redmag CI

on:
  push:
    branches:
      - rewrite
  pull_request:
    branches:
      - rewrite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hemtt-check:
    name: HEMTT checks
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@6b14235d84dc6e141421610c7d14043f17c4c8b9
    with:
      operation: Check
      framework-ref: 6b14235d84dc6e141421610c7d14043f17c4c8b9
      hemtt-version: v1.21.0
    secrets:
      framework_token: ${{ secrets.FRAMEWORK_TOKEN }}

  hemtt-build:
    name: HEMTT build
    needs: hemtt-check
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@6b14235d84dc6e141421610c7d14043f17c4c8b9
    with:
      operation: Build
      framework-ref: 6b14235d84dc6e141421610c7d14043f17c4c8b9
      hemtt-version: v1.21.0
    secrets:
      framework_token: ${{ secrets.FRAMEWORK_TOKEN }}
