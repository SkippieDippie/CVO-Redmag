name: CVO Redmag CI

on:
  push:
    branches:
      - rewrite
  pull_request:
    branches:
      - rewrite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hemtt-check:
    name: HEMTT checks
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@6a490c6409dedcdd26bdf3bf1a8b5075c8909a18
    with:
      operation: Check
      framework-ref: 6a490c6409dedcdd26bdf3bf1a8b5075c8909a18
      hemtt-version: v1.21.0

  hemtt-build:
    name: HEMTT build
    needs: hemtt-check
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@6a490c6409dedcdd26bdf3bf1a8b5075c8909a18
    with:
      operation: Build
      framework-ref: 6a490c6409dedcdd26bdf3bf1a8b5075c8909a18
      hemtt-version: v1.21.0
