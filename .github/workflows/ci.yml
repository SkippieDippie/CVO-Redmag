name: CVO Redmag CI

on:
  push:
    branches:
      - rewrite
  pull_request:
    branches:
      - rewrite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hemtt-check:
    name: HEMTT checks
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@252205fb5996f24523585236998f9e8b7a426817
    with:
      operation: Check
      framework-ref: 252205fb5996f24523585236998f9e8b7a426817
      hemtt-version: v1.21.0

  hemtt-build:
    name: HEMTT build
    needs: hemtt-check
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@252205fb5996f24523585236998f9e8b7a426817
    with:
      operation: Build
      framework-ref: 252205fb5996f24523585236998f9e8b7a426817
      hemtt-version: v1.21.0
