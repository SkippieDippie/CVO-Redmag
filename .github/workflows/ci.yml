name: CVO Redmag CI

on:
  push:
    branches:
      - rewrite
  pull_request:
    branches:
      - rewrite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hemtt-check:
    name: HEMTT checks
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@efda297dca0ecb1e71b6872269dfbd643b3198cd
    with:
      operation: Check
      framework-ref: efda297dca0ecb1e71b6872269dfbd643b3198cd
      hemtt-version: v1.21.0

  hemtt-build:
    name: HEMTT build
    needs: hemtt-check
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@efda297dca0ecb1e71b6872269dfbd643b3198cd
    with:
      operation: Build
      framework-ref: efda297dca0ecb1e71b6872269dfbd643b3198cd
      hemtt-version: v1.21.0
