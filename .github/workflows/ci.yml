name: CVO Redmag CI

on:
  push:
    branches:
      - rewrite
  pull_request:
    branches:
      - rewrite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hemtt-check:
    name: HEMTT checks
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@c26a9974afc83703d5c99a2c1b6c15017114f4d2
    with:
      operation: Check
      framework-ref: c26a9974afc83703d5c99a2c1b6c15017114f4d2
      hemtt-version: v1.21.0

  hemtt-build:
    name: HEMTT build
    needs: hemtt-check
    uses: SkippieDippie/Arma3-Mod-Workflows/.github/workflows/hemtt.yml@c26a9974afc83703d5c99a2c1b6c15017114f4d2
    with:
      operation: Build
      framework-ref: c26a9974afc83703d5c99a2c1b6c15017114f4d2
      hemtt-version: v1.21.0
